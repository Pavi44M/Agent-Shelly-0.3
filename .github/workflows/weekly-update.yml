name: weekly-update
# Every Monday ~7am NZ time: regenerate the demo data up to yesterday, rerun Shelly,
# and publish the refreshed site (GitHub Pages serves docs/).
on:
  schedule:
    - cron: "0 18 * * 0"   # Sunday 18:00 UTC = Monday 07:00 NZDT
  workflow_dispatch:        # "Run workflow" button in the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: LibreOffice (gives Excel formulas cached values so phone previews show numbers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc-nogui > /dev/null
      - name: Regenerate demo data up to yesterday (NZ time)
        run: python scripts/generate_sample_data.py --end "$(TZ=Pacific/Auckland date -d yesterday +%F)"
      - name: Run Shelly and rebuild the site
        run: python scripts/build_site.py
      - name: Publish
        run: |
          git config user.name "shelly-bot"
          git config user.email "shelly-bot@users.noreply.github.com"
          git add docs
          git commit -m "Weekly update: $(TZ=Pacific/Auckland date +%F)" || echo "No changes"
          git push
