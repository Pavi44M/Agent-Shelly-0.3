roles:   # floor and road roles: who does what, and how many across the business
  - {role: Shift Supervisor, dept: Warehouse, count: 9, colour: "#f2c14e", does: "Runs a shift on one site: allocates people and forklifts, watches the dock board, signs off despatch."}
  - {role: Team Leader, dept: Warehouse, count: 12, colour: "#ffd27a", does: "Leads a zone (receiving, picking, despatch); first call for problems on the floor."}
  - {role: Forklift Operator, dept: Warehouse, count: 26, colour: "#ff9f43", does: "Counterbalance and reach trucks: unloads trucks, puts pallets away, lets down for picking, loads outbound."}
  - {role: Order Picker, dept: Warehouse, count: 34, colour: "#3fb87f", does: "Picks store and clinic orders by scanner (FEFO for medicines), builds and wraps pallets."}
  - {role: Receiver / Checker, dept: Warehouse, count: 10, colour: "#63b6d8", does: "Checks inbound against the ASN, temperature on arrival and batch/expiry; flags shortages."}
  - {role: Loader, dept: Warehouse, count: 14, colour: "#5ec8c8", does: "Stages and loads outbound in drop order; seals reefers and records temperatures."}
  - {role: Inventory Controller, dept: Warehouse, count: 6, colour: "#b69cf2", does: "Cycle counts, stock adjustments, recalls and quarantine."}
  - {role: Yard Marshal, dept: Yard, count: 5, colour: "#ffe066", does: "Guides trucks onto docks, keeps the yard one-way and pedestrians out of truck lanes."}
  - {role: Gatehouse Officer, dept: Yard, count: 4, colour: "#9aa7ff", does: "Checks trucks in and out, booking slots, seals and paperwork."}
  - {role: Transport Planner, dept: Transport, count: 4, colour: "#ff9f6e", does: "Builds tomorrow's routes, books dock slots, balances trucks against drops."}
  - {role: Dispatcher, dept: Transport, count: 4, colour: "#ff9f6e", does: "Live control of trucks on the road: delays, re-routes, customer ETAs."}
  - {role: Truck Driver, dept: Transport, count: 28, colour: "#e9eef3", does: "Rigid, semi and reefer drivers: pre-trip checks, deliveries, proof of delivery, temperature logs."}
  - {role: Van Courier (pharma), dept: Transport, count: 6, colour: "#8c6bdc", does: "Same-day 2–8°C runs to hospitals, clinics and labs."}
  - {role: Diesel & EV Mechanic, dept: Fleet, count: 4, colour: "#9aa7ff", does: "Services trucks, reefer units and forklifts; manages chargers."}
  - {role: Quality Officer (GDP), dept: Quality, count: 3, colour: "#b69cf2", does: "Temperature monitoring, deviations, release of quarantined stock."}
  - {role: Customer Service Coordinator, dept: Clients, count: 5, colour: "#7fd1a8", does: "Client orders, booking changes, delivery questions and claims."}
  - {role: Cleaner / Hygiene, dept: Facilities, count: 4, colour: "#d9dde2", does: "Food-safe hygiene in chilled zones, dock and amenities."}

# Where Gateway goes next (the module grows from v1.1)
roadmap:
  - {v: "1.2", title: Client portal, text: "Each client sees its own stock, orders, deliveries and temperature logs live, and books dock slots itself."}
  - {v: "1.3", title: Route optimiser, text: "Shelly plans tomorrow's routes overnight: fewer kilometres, deliveries inside each store's receiving window."}
  - {v: "1.4", title: Electric fleet & solar, text: "Charge EV trucks from rooftop solar at Wiri; carbon per delivery on every client report."}
  - {v: "1.5", title: Robots in the aisles, text: "Autonomous pallet movers between docks and racks; drones for night-time cycle counts."}
  - {v: "2.0", title: Gateway network, text: "A second region (Hamilton or Tauranga), multi-tenant pricing and a marketplace for spare pallet space."}
