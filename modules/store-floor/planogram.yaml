# ---------------------------------------------------------------------------
# v3: the store team at work. Everything the day simulation does comes from
# here, so hours, shifts, breaks, deliveries, the team and footfall can change
# without touching code. Times are 24h "HH:MM"; days are Mon..Sun.
# ---------------------------------------------------------------------------
operations:
  trading_hours: {open: "07:00", close: "21:00"}          # every day
  shifts:
    - {id: am, name: Morning, start: "06:00", hours: 8}
    - {id: pm, name: Evening, start: "13:30", hours: 8}    # 30 min handover, closes up after 9pm
  breaks:                                                   # hours after the shift starts
    - {after_h: 2, minutes: 10, name: "Morning tea"}
    - {after_h: 4, minutes: 30, name: Lunch}
    - {after_h: 6, minutes: 10, name: "Short break"}
  break_stagger_minutes: 15                                 # so the till is never left empty
  deliveries: {days: [Tue, Thu, Sat], arrive: "06:15", pallets: 6, from: "Distribution centre"}
  avg_basket_nzd: 14                                        # customers/day = average daily sales / basket
  # share of the day's customers arriving in each trading hour (busier after 5pm)
  footfall: {"7": 6, "8": 7, "9": 5, "10": 4, "11": 5, "12": 9, "13": 7, "14": 5, "15": 6, "16": 7, "17": 11, "18": 12, "19": 10, "20": 6}
  team:                                                     # synthetic names; shirt colour by role
    - {id: dm-am, name: Mere,  role: Duty Manager, shift: am}
    - {id: am-1,  name: Arjun, role: Store Team,   shift: am}
    - {id: am-2,  name: Sione, role: Store Team,   shift: am}
    - {id: am-3,  name: Grace, role: Store Team,   shift: am, days: [Tue, Thu, Sat]}   # extra hands on load days
    - {id: dm-pm, name: Liam,  role: Duty Manager, shift: pm}
    - {id: pm-1,  name: Priya, role: Store Team,   shift: pm}
    - {id: pm-2,  name: Tom,   role: Store Team,   shift: pm}
    - {id: pm-3,  name: Ana,   role: Store Team,   shift: pm, days: [Fri, Sat, Sun]}    # busy evenings
    - {id: sm,    name: Alex,  role: Store Manager, start: "09:00", hours: 8, days: [Mon, Tue, Wed, Thu, Fri]}
  routines:                                                 # fixed jobs; "at" = when it becomes due
    - {at: "06:05", task: "Switch on lights and tills", where: checkout, minutes: 10, role: Duty Manager}
    - {at: "06:20", task: "Fill bakery shelves", where: bakery, minutes: 25}
    - {at: "06:30", task: "Hot food: first bake", where: hotfood, minutes: 20}
    - {at: "06:40", task: "Rotate dairy (first expiry, first out)", where: dairy, minutes: 20}
    - {at: "06:55", task: "Unlock doors and open the store", where: entrance, minutes: 5, role: Duty Manager}
    - {at: "10:00", task: "Place today's order", where: desk, minutes: 30, role: Store Manager}
    - {at: "11:00", task: "Hot food: lunch bake", where: hotfood, minutes: 20}
    - {at: "15:30", task: "Mark down short-dated Grab & Go", where: grabgo, minutes: 15}
    - {at: "16:30", task: "Hot food: dinner bake", where: hotfood, minutes: 20}
    - {at: "20:15", task: "Face up all aisles", where: pantry, minutes: 30}
    - {at: "20:30", task: "Clean and mop the floor", where: snacks, minutes: 30}
    - {at: "21:00", task: "Lock doors and close the store", where: entrance, minutes: 5, role: Duty Manager}
    - {at: "21:05", task: "Cash up and banking", where: desk, minutes: 20, role: Duty Manager}

