# Neighbourhood store floor plan (planogram) for Shelly's 3D Store Floor.
#
# Geometry is traced from the printed store plan: x/y are pixels on the scanned
# plan (1 px = 2 cm). rect = [x1, y1, x2, y2]; face = the side shoppers stand on
# (E/W/N/S), or none for fixtures shopped from both sides.
# seg = [x1, y1, x2, y2] is a centre line, used for the slanted back-wall run.
#
# Which products sit where:
#   skus:        exact SKUs on this fixture (checked first)
#   categories:  any other SKU of these Shelly categories lands here (first match wins)
#   shelf: false marks a service point (checkout, service desk) that holds no stock
# A SKU that matches nothing is listed as "not placed" in the build output,
# so a new line in a real export never silently disappears.
plan:
  name: "Neighbourhood Store"
  px_to_m: 0.02
  centre_px: [692, 900]
  sales_floor: [[378, 358], [1330, 398], [1330, 1640], [795, 1640], [795, 1480], [355, 1480], [355, 1190], [378, 1190]]
  walls:
    - [[378, 358], [1330, 398]]
    - [[1330, 398], [1330, 1640]]
    - [[1330, 1640], [895, 1640], glass]
    - [[895, 1640], [795, 1640], door]
    - [[795, 1640], [795, 1480]]
    - [[795, 1480], [355, 1480]]
    - [[355, 1480], [355, 1190]]
    - [[355, 1190], [378, 1190]]
    - [[378, 1190], [378, 1085], staff]
    - [[378, 1085], [378, 358]]
  entrance_px: [822, 1600]

fixtures:
  # back wall run (slanted on the plan)
  - {id: bakery, name: "Bakery & Bread", zone: Fresh, colour: "#e6cf3d", type: wall, seg: [445, 390, 595, 396.25], height: 1.9, kind: box,
     skus: [BAK001, BAK002, BAK003], categories: [Bakery], items: [Sandwich loaves, Wraps, Rolls, Croissants]}
  - {id: juice, name: "Juice, Kombucha & Iced Coffee", zone: Chilled & frozen, colour: "#a9c8e4", type: chiller, seg: [595, 396.25, 740, 402.29], height: 2.1, kind: bottle,
     skus: [BEV004, BEV005], items: [Orange juice, Smoothies, Kombucha, Iced coffee]}
  - {id: dairy, name: "Milk, Butter & Cheese", zone: Chilled & frozen, colour: "#2f5f9e", type: multideck, seg: [740, 402.29, 1040, 414.79], height: 2.1, kind: bottle,
     categories: [Dairy], items: [Milk, Butter, Cheese, Yoghurt]}
  - {id: drinks, name: "Chilled Drinks", zone: Chilled & frozen, colour: "#a9c8e4", type: chiller, seg: [1040, 414.79, 1285, 425], height: 2.1, kind: bottle,
     skus: [BEV001, BEV003, BEV006], categories: [Beverages], items: [Energy drinks, Sparkling water, Water]}
  # left wall: produce and eggs
