  - id: retail
    n: 2
    name: Smart retail and experiential mall
    lead: Neighbourhood Store
    business: store
    floors: ["3", "2", "G"]
    text: "Every visit becomes data that helps the store and the tenants sell better, without ever knowing who the shopper is."
