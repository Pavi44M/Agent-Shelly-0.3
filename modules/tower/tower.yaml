    lead: Tōtara Medical (imports) with Gateway
    business: totara
    floors: ["15", "14", "24", "23"]
    text: "A business can find a partner, agree a deal, clear the paperwork and ship the goods without leaving the building."
    caps: ["AI translation in every room, including Te Reo Māori and major Asia-Pacific languages", "Unified tenant portal: amenities, visitor passes, cross-brand loyalty and shared procurement", "Customs and cargo pre-clearance matched to NZ Customs and biosecurity requirements", "AI trade matchmaking that books the room and the interpreter", "Digital trade documents: bills of lading, certificates of origin, letters of credit", "Multi-currency settlement with exchange-rate exposure shown before signing", "Export readiness desk for local SMEs", "Time-zone deal rooms for Auckland, Singapore, Dubai and London", "Virtual trade showrooms for overseas buyers"]
  - id: mobility
