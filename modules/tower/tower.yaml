    lead: Gateway transport with Shelly Energy
    business: gateway
    floors: ["R", "B2", "G"]
    text: "People, parcels and vehicles are one flow, so arrivals, departures and deliveries never fight for the same kerb or lift."
    caps: ["Robotic EV chargers with vehicle-to-grid: parked cars feed the tower at peak and owners are paid", "Rooftop drone hub and vertiport, ready for air taxis within Civil Aviation Authority rules", "Live transit sync: shuttles called ahead of exit surges", "Autonomous valet parking", "Dynamic kerb: taxi rank, delivery bay or pick-up by time of day", "Sidewalk robots and cargo e-bikes from the MFC", "Active travel hub with bike parking, showers and repair", "One mobility pass billed to the employer"]
