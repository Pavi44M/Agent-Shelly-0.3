sustainability:
  - {name: On-site generation, text: "Solar glass in the façade and rooftop panels, sized around the drone and vertiport pads."}
  - {name: Battery and microgrid, text: "On-site storage plus EV fleet batteries run critical systems in island mode during a grid outage."}
  - {name: Energy trading, text: "Shelly buys when spot prices are low, sells stored energy at peak and joins demand-response programmes."}
  - {name: Water, text: "Rainwater harvesting and greywater reuse for cooling, toilets and landscaping; leak detection on every riser."}
  - {name: AI waste sorting, text: "Vision-guided bins and a sorting line separate organics, recycling and landfill, with contamination reported per tenant."}
  - {name: Carbon dashboard, text: "Every tenant sees its energy, water, waste and transport emissions live, ready for climate reporting."}
  - {name: Embodied carbon, text: "Low-carbon concrete and timber where possible, tracked in the digital twin from construction on."}
  - {name: Certification target, text: "A top Green Star and NABERSNZ rating, set as a design requirement."}

trust:
  privacy: ["Edge anonymisation: video becomes anonymous counts and paths on site; raw footage of faces never goes to the cloud", "Consent ledger: every opt-in recorded and withdrawn in one tap", "Built to the NZ Privacy Act 2020 and the Privacy Commissioner's biometric rules, with a privacy impact assessment for every new feature", "Māori data sovereignty in line with Te Mana Raraunga principles"]
  governance: ["Decision tiers: acts alone on low impact, asks a person on medium, only advises on high", "Explainability: every pricing, access or staffing decision traces to its data and rule", "Regular bias and fairness audits of pricing, access and security models", "Life-safety boundary: fire, evacuation and structural systems keep their certified controls; Shelly informs but never overrides"]
  resilience: ["Zero trust everywhere: building systems, tenant networks and guest Wi-Fi separated; every device proves its identity", "Seismic resilience: base isolation and structural-health sensors; the twin assesses damage within minutes of an earthquake", "Graceful degradation: if Shelly OS or the cloud fails, every system falls back to safe local control"]

