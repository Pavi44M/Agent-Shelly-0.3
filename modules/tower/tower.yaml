# Shelly Tower: the Shelly Business Tower, the group's head office and business complex (module v1.3).
# Built from "Shelly Business Tower: Integrated Architecture" (Pavi, 9 Oct 2026): a commerce operating system with a
# building around it. One brain (Shelly OS) with specialist agents runs every floor, shelf, robot, vehicle and tenant
# system, and every Shelly business has its place: the business and technology cores at the top, each business on its
# floors, the trade centre, hotel, mall, micro-fulfilment centre and mobility hub around them, and floors to let.
# Everything here is fictional (synthetic demo data): the tower, tenants, people, rents and figures.
tower:
  name: Shelly Tower
  long_name: Shelly Business Tower
  short: Tower
  module_version: "1.3"
  address: Wynyard Quarter, Auckland waterfront (concept)
  tagline: A commerce operating system with a building around it. One brain, Shelly OS, runs every floor, shelf, robot, vehicle and tenant, and every Shelly business has its place.
  vision: "The Shelly Business Tower runs as one intelligent organism: every floor, shelf, robot, vehicle and tenant system feeds one brain, Shelly OS, which senses, predicts, decides and learns. An office booking, a shelf restock, a customs clearance and a drone departure are all events on the same platform."
  positioning: "The Southern Hemisphere's reference site for AI-run mixed-use commerce, with Auckland as the gateway between Australasia, Asia and the Pacific."
  height_m: 142
  floor_m2: 1450          # lettable area of a typical office floor
  opened: "2026"

principles:
  - {name: "One brain, many agents", text: "A central intelligence, Shelly OS, delegates to specialist AI agents for each sector, just as the Shelly Brain does for each business."}
  - {name: Human-confirmed autonomy, text: "Shelly acts on routine decisions and asks a person before any high-impact one. Every decision lands in one approvals tray."}
  - {name: Privacy by architecture, text: "Personal data is anonymised at the edge, so insight never needs identity."}
  - {name: Net-positive by design, text: "The tower produces, stores and trades energy, not just consumes it."}
  - {name: Open platform, text: "Tenants, suppliers and the city plug in through one API layer, and Shelly OS can be licensed to other buildings."}

eras:
  - id: now
    name: Today
    year: 2026
    title: Shelly Tower · today
    look: [Glass and steel tower on a four-storey podium, Rooftop sky garden and helipad, External glass lifts, Street-level Neighbourhood Store flagship, EV charging in the basement]
  - id: future
    name: "2050"
    year: 2050
    title: Shelly Business Centre · 2050
    look: [Twisting bio-glass tower wrapped in a living vertical garden, Skyways and sky bridges linking it to the satellite towers and the buildings on both sides, Floating garden platforms under glass domes, A live holographic world map and rings that show every business, Air taxis, flying cars and drones between the towers, Media screens on the podium and the plaza]

# The architecture: six layers with Shelly OS in the middle. Data flows up, decisions flow down; trust runs down the side of all of them.
layers:
  - {n: 6, name: Experiences & open API, text: "Tenant app, building copilot, kiosks, lobby screens, the tenant portal and one API layer for tenants, suppliers and the city.", items: [Tenant app, Building copilot, Tenant portal & API, Lobby and retail screens]}
  - {n: 5, name: Sector services, text: "The sectors the tower runs: workplace, retail, FMCG and logistics, trade, mobility, energy, health, hospitality, innovation.", items: [Workplace, Retail mall, Fulfilment, Trade centre, Mobility, Energy]}
  - {n: 4, name: Shelly OS, text: "The multi-agent brain: one orchestrator, the agent mesh, the human-in-the-loop decision ledger and the self-learning loop.", items: [Orchestrator, Agent mesh, Decision ledger, Self-learning loop], core: true}
  - {n: 3, name: Data fabric & digital twin, text: "Every sensor, robot and tenant system writes to one data fabric; the live digital twin doubles as a simulation sandbox.", items: [Data fabric, Digital twin, Simulation sandbox, Commerce graph]}
  - {n: 2, name: Edge & connectivity, text: "Edge servers in the building make time-critical decisions (access, robotics, safety); heavy analytics run in the cloud.", items: [Edge servers, Zero-trust network, Private 5G & IoT, Cloud]}
  - {n: 1, name: Physical building, text: "Structure, façade, lifts, HVAC, sensors, shelves, robots, vehicles, drones, batteries and the solar glass.", items: [Sensors & cameras, Robots & lifts, Vehicles & drones, Solar, battery & HVAC]}
trust_band: [Edge anonymisation, Consent ledger, Zero trust, Explainability, Life-safety boundary]

# Shelly OS: what was defined, elevated, and the new capabilities
os_elevated:
  - {cap: Predictive operations and energy, original: "Adjusts lighting, HVAC and power from occupancy, weather and spot prices.", elevated: "Runs the tower as a virtual power plant: pre-cools floors when power is cheap, sells stored energy back at peak and joins grid demand-response events automatically."}
  - {cap: Unified digital twin, original: "Real-time 3D view of structure, air, foot traffic and logistics.", elevated: "A simulation sandbox: test a new store layout, a fire evacuation, a 30% traffic surge or a supplier failure before it happens, then push the winning plan live."}
  - {cap: Tenant cross-ecosystem engine, original: "Links retail stock, FMCG nodes, transit and tenant apps.", elevated: "A commerce graph that matches any demand in the tower to the nearest supply: an office lunch order is filled from the food hall, a retail stock-out from the basement MFC."}
os_new:
  - {name: Shelly agent mesh, text: "Specialist agents negotiate with each other through the orchestrator."}
  - {name: Human-in-the-loop decision ledger, text: "Routine actions run on their own; anything over a cost, risk or customer-impact threshold goes to a named person for one-tap approval, with the reasoning logged."}
  - {name: Predictive maintenance, text: "Vibration, current and thermal sensors on lifts, escalators, chillers and robots book the technician before the breakdown."}
  - {name: Natural-language building copilot, text: "Managers ask in plain words (why was level 12 warm yesterday?) and get the answer with the chart and the evidence."}
  - {name: Federated learning, text: "Tenants' models learn from each other's patterns without any tenant's raw data leaving its own environment."}
  - {name: Edge plus cloud, text: "Access, robotics and safety decide on edge servers in the building, so the tower keeps working if the internet drops."}
  - {name: Self-learning loop, text: "Every forecast is scored against what happened; drifting models are retrained or rolled back automatically."}

# The agent mesh: the tower's specialist agents (they also sit in the Shelly Brain)
mesh:
  - {id: tower-workplace, name: Workplace, icon: "▦", colour: "#63b6d8", does: "Desks, rooms, hybrid-work forecasts, meeting intelligence and the flex-space marketplace."}
  - {id: tower-retail, name: Retail, icon: "🛒", colour: "#1f8a5b", does: "Mall footfall, dynamic pricing with guardrails, retail media and pop-up pods."}
  - {id: tower-logistics, name: Logistics, icon: "⛟", colour: "#2f6fd6", does: "The basement micro-fulfilment centre, dock and goods-lift slots, cold chain and traceability (run with Gateway)."}
  - {id: tower-trade, name: Trade, icon: "⇄", colour: "#ff7ad9", does: "Trade matchmaking, digital trade documents, customs pre-clearance and settlement (with Tōtara Medical's import team)."}
  - {id: tower-mobility, name: Mobility, icon: "✈", colour: "#9a7bff", does: "EV charging and valet, kerb bookings, transit sync, drones and the rooftop vertiport."}
  - {id: tower-energy, name: Energy, icon: "⚡", colour: "#ffc466", does: "Solar, the battery microgrid, vehicle-to-grid, demand response and the carbon dashboard (Shelly Energy)."}
  - {id: tower-security, name: Security, icon: "⛨", colour: "#e66767", does: "Zero-trust access, cyber-physical alerts, privacy and consent, seismic and safety monitoring."}
  - {id: tower-concierge, name: Concierge, icon: "◎", colour: "#7fd1a8", does: "Visitors, wayfinding, the hotel, translation and the building copilot for everyone in the tower."}
negotiations:
  - {from: Mobility, to: Energy, text: "6pm exit surge predicted on B2: hold EV charging until 7pm so the lifts and chillers keep their power.", result: agreed}
  - {from: Retail, to: Logistics, text: "Bananas will sell out in the mall by 3pm: pull two crates from the basement MFC now.", result: done}
  - {from: Workplace, to: Energy, text: "Thursday attendance forecast 41%: consolidate tenants onto fewer floors and power down levels 9 and 12.", result: agreed}
  - {from: Trade, to: Concierge, text: "Singapore delegation lands 10:40: book the time-zone deal room, an interpreter and two hotel rooms.", result: done}
  - {from: Logistics, to: Mobility, text: "Three trucks booked for 7:00 to 7:20: switch the kerb to delivery bays until 7:30.", result: agreed}
decision_tiers:
  - {tier: Low, rule: "Shelly acts alone, logs the reason", examples: "Pre-cool a floor, reorder within limits, call a shuttle"}
  - {tier: Medium, rule: "Shelly asks a named person, one tap", examples: "Large supplier order, sell stored energy, a price change near its daily cap"}
  - {tier: High, rule: "Shelly only advises; people decide", examples: "A new lease, a new business, anything touching safety or pay"}
ledger:
  - {agent: Energy, tier: Low, action: "Pre-cooled levels 21 to 26 at 5:40 while power was 9c/kWh", outcome: "Saved $86 on the afternoon peak", status: done}
  - {agent: Logistics, tier: Low, action: "Reordered 18 lines for the mall within approved limits", outcome: "No stock-outs on top sellers today", status: done}
  - {agent: Retail, tier: Low, action: "Marked down 24 bread and dairy items 30% at 4pm (perishable AI)", outcome: "Sold 21; 3 routed to food rescue", status: done}
  - {agent: Logistics, tier: Medium, action: "Supplier order for the MFC over the auto limit ($18,400)", outcome: "Waiting in the approvals tray", status: waiting, request: tw-mfc-restock}
  - {agent: Energy, tier: Medium, action: "Sell 1.2 MWh of stored energy into the 6pm peak", outcome: "Approved by Finance · $310 earned", status: approved}
  - {agent: Concierge, tier: Low, action: "Booked deal room 15B, interpreter and 2 hotel rooms for a Singapore delegation", outcome: "Confirmed", status: done}
  - {agent: Security, tier: High, action: "Badge used on level 3 while the same login came from overseas", outcome: "Advised: account locked by the security lead", status: approved}
  - {agent: Workplace, tier: High, action: "Lease half of level 12 to Ruru Accounting", outcome: "Waiting for Pavi", status: waiting, request: tw-lease-12}

# The sectors, matched to Shelly's businesses. floors = where it lives in the tower.
sectors:
